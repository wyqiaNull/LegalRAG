# LegalRAG 默认配置（消融只改这里，主流程零改动）
# 每个组件名对应 core/registry 里注册的实现变体。

ingest:
  loader: auto            # 按扩展名分派 pdf/docx/txt
  chunker: clause         # v0.1 默认按完整法条分块；fixed_len 保留作 baseline
  chunk_size: 512
  chunk_overlap: 64

embedding:
  impl: bge_m3_api        # dense embedding；BM25 稀疏检索由内存存储计算
  dim: 1024
  batch_size: 32

store:
  vector: memory          # [MVP] 内存实现，接口与 Milvus 一致；量大再切
  metadata: postgres      # 元数据、访问策略与文档版本关系持久化
  path: data/processed    # 内存实现落盘目录（跨 CLI 调用持久化）

retrieval:
  impl: hybrid_rerank     # BM25 + dense 双路召回，经 RRF 融合
  top_n: 50
  top_k: 5
  rrf_k: 60

rerank:
  impl: bge_api
  timeout: 30

generation:
  impl: default
  max_context_chunks: 5
  temperature: 0.2

llm:
  impl: openai            # OpenAI 兼容 API（如 Qwen/DeepSeek）；离线/测试可切 echo

conversation:
  enabled: true
  resolver: llm
  store: redis
  history_turns: 4
  ttl_seconds: 604800      # 7 天；每次成功问答后刷新
  key_prefix: legalrag:conversation
  path: ""                # JSON 实现使用；留空时为 <store.path>/conversations.json

routing:
  enabled: true
  impl: llm               # 指代消解后、权限过滤和检索前执行 LLM 路由

reflection:
  enabled: true
  impl: score_threshold   # 使用真实 reranker 的相关性分数判断召回质量
  max_retries: 1          # 首次检索后最多改写并重检一次
  min_candidates: 1
  min_score: 0.5          # 首版默认值，后续通过 v0.5 评测调优

contract:
  enabled: true
  contract_type: labor    # v0.4 仅支持劳动合同
  max_context_chunks: 5

governance:
  permissions_enabled: true
  permission_filter: acl
  versions_enabled: true
  version_filter: current
  shared_tenant_id: __global__
  shared_doc_types: [regulation]
  acl_policies:
    - role: legal_staff
      allowed_confidentiality: [public, internal, secret]
      allowed_doc_types: [regulation, policy, legal_opinion]
    - role: business_user
      allowed_confidentiality: [public, internal]
      allowed_doc_types: [regulation, policy, legal_opinion]
    - role: compliance_auditor
      allowed_confidentiality: [public, internal, secret]
      allowed_doc_types: [regulation, policy, legal_opinion]
    - role: external_client
      allowed_confidentiality: [public]
      allowed_doc_types: [regulation, policy, legal_opinion]

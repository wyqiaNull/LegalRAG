# 离线配置：无 API key / 无网络即可跑通 ingest→query（仅验证链路，非生产质量）。
# 用确定性本地 embedder + 占位 LLM，角色等同 NoopReranker。生产请用 default.yaml。

ingest:
  loader: auto
  chunker: fixed_len
  chunk_size: 300
  chunk_overlap: 50

embedding:
  impl: local_hash        # 确定性词面哈希向量，仅离线用
  dim: 256
  batch_size: 32

store:
  vector: memory
  metadata: memory
  path: data/processed

retrieval:
  impl: vector_only
  top_n: 3
  top_k: 3
  rrf_k: 60

rerank:
  impl: noop

generation:
  impl: default
  max_context_chunks: 3

llm:
  impl: echo              # 占位回显，不产真实法律意见

conversation:
  enabled: false          # echo 不具备指代改写能力
  resolver: llm
  store: json
  history_turns: 4
  ttl_seconds: 604800
  key_prefix: legalrag:conversation
  path: ""

routing:
  enabled: false          # echo 不具备分类能力，保持离线 RAG 冒烟链路
  impl: llm

reflection:
  enabled: false          # noop/fusion 分数未经校准，不参与质量门槛判断
  impl: score_threshold
  max_retries: 1
  min_candidates: 1
  min_score: 0.5

governance:
  permissions_enabled: false
  permission_filter: acl
  versions_enabled: false       # 按 README 的无版本参数命令保留基础离线冒烟
  version_filter: current
  shared_tenant_id: __global__
  shared_doc_types: [regulation]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legalrag"
version = "1.0.0"
description = "LegalRAG —— 企业级合同法规智能问答与合同审查服务"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
eval = [
    "langchain-openai>=0.3,<0.4",
    "ragas==0.3.9",
]
service = [
    "anyio>=4.4,<4.10",
    "celery[redis]>=5.4,<6",
    "fastapi>=0.115,<0.116",
    "pymilvus>=2.5,<2.6",
    "pyjwt>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
legalrag = "legalrag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
